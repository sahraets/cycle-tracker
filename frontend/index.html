<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycle Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>Cycle Tracker</h1>
        <p class="subtitle">Log today's temperature to check your fertile window.</p>

        <div class="input-section">
            <label for="temperature">Temperature (°C)</label>
            <input type="number" id="temperature" step="0.01" min="34" max="42" placeholder="36.50">

            <label for="date">Date</label>
            <input type="date" id="date">

            <div class="checkbox-row">
                <input type="checkbox" id="menstruation">
                <label for="menstruation">Menstruation today</label>
            </div>

            <button type="button" id="log-btn">Save &amp; check fertility</button>
        </div>

        <p class="message" id="message" hidden></p>

        <section class="result-section" id="result" hidden>
            <div class="status-circle" id="status-circle"></div>
            <h2 id="status-text"></h2>
            <div class="detail-row">
                <span>Cycle day</span>
                <span id="cycle-day">–</span>
            </div>
            <div class="detail-row">
                <span>Coverline</span>
                <span id="coverline">–</span>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
